# ─── Identity ────────────────────────────────────────────────────────────────
title:            fullgc
tagline:          "Practical guides for the backend guild"
description:      >-
  Practical, in-depth engineering write-ups on Scala, the JVM, Akka, Kubernetes,
  Consul and HashiCorp Vault — by Dani Shemesh, backend and infrastructure engineer.
url:              "https://fullgc.github.io"
baseurl:          ""
lang:             en_US
timezone:         Asia/Jerusalem

author:
  name:    Dani Shemesh
  email:   dani.shemesh@hotmail.com
  bio:     Backend & infrastructure engineer. I write about the JVM, Scala, and the systems around them.
  avatar:  /img/me-about.jpg

# Used by jekyll-seo-tag for schema.org sameAs + the footer links
social:
  name:  Dani Shemesh
  links:
    - https://github.com/FullGC
    - https://www.linkedin.com/in/dani-shemesh

github_username:   FullGC
linkedin_username: dani-shemesh

# ─── Third party (leave blank to disable entirely) ───────────────────────────
# GoatCounter: the subdomain of your goatcounter.com site code.
goatcounter: "dani-fullgc"

# giscus: fill these in from https://giscus.app after enabling Discussions.
giscus:
  repo:        "FullGC/fullgc.github.io"
  repo_id:     ""
  category:    "Comments"
  category_id: ""

# ─── Build ───────────────────────────────────────────────────────────────────
markdown:    kramdown
highlighter: rouge
permalink:   pretty
sass:
  style: compressed
  sourcemap: never

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  path: feed.xml   # keep the historical /feed.xml path for existing subscribers

defaults:
  - scope:  { path: "", type: posts }
    values:
      layout:   post
      author:   Dani Shemesh
      comments: true
  - scope:  { path: "" }
    values:
      layout: page
  # Google Search Console verification stubs — not pages. No layout (their body
  # must be the exact token string) and kept out of the sitemap.
  - scope:  { path: "google4218bf4e7ccc7bff.html" }
    values:
      sitemap: false
      layout: null
  - scope:  { path: "google5087a1e9f7f7b875.html" }
    values:
      sitemap: false
      layout: null

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - LICENSE
  - makeover.text
  - drafts
  - "*.iml"
  - .idea
